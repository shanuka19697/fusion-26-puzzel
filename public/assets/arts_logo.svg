<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="neonBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e1035"/>
    </linearGradient>
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="pinkOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="url(#neonBg)"/>

  <!-- Cybernetic Glowing Rings -->
  <circle cx="300" cy="300" r="230" fill="none" stroke="url(#cyanPurple)" stroke-width="6" opacity="0.8"/>
  <circle cx="300" cy="300" r="210" fill="none" stroke="url(#pinkOrange)" stroke-width="2" stroke-dasharray="12 8"/>

  <!-- Dynamic Geometric Art Flames / Crest -->
  <path d="M 300 110 Q 380 200 350 300 Q 420 280 440 380 C 420 460, 320 480, 300 480 C 280 480, 180 460, 160 380 C 180 280, 250 280, 250 300 Q 220 200 300 110 Z" fill="url(#cyanPurple)" opacity="0.85"/>
  <path d="M 300 160 Q 350 240 330 320 Q 380 300 390 380 C 370 440, 310 450, 300 450 C 290 450, 230 440, 210 380 C 220 300, 270 300, 270 320 Q 250 240 300 160 Z" fill="url(#pinkOrange)"/>

  <!-- Central Emblem Mask / Palette -->
  <circle cx="300" cy="330" r="80" fill="#0f172a" stroke="#fbbf24" stroke-width="4"/>

  <!-- Text Overlay -->
  <text x="300" y="325" text-anchor="middle" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="42" fill="#ffffff" letter-spacing="2">FUSION</text>
  <text x="300" y="365" text-anchor="middle" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="38" fill="#fbbf24" letter-spacing="4">'26</text>

  <!-- Subtitle -->
  <text x="300" y="520" text-anchor="middle" font-family="'Outfit', 'Inter', sans-serif" font-weight="700" font-size="20" fill="#38bdf8" letter-spacing="3">ARTS CLUB</text>
  <text x="300" y="550" text-anchor="middle" font-family="'Outfit', 'Inter', sans-serif" font-weight="600" font-size="14" fill="#94a3b8" letter-spacing="2">FACULTY OF TECHNOLOGY - UOC</text>
</svg>
